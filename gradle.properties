# gradle.properties — all the version numbers live here, so updating the mod
# to a new Minecraft version is mostly a matter of editing this one file.
# Check https://fabricmc.net/develop for the newest values for your version.

# Give Gradle enough memory to decompile/remap Minecraft.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Fabric / Minecraft versions ---
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.10
loom_version=1.10-SNAPSHOT

# Fabric API: the library of "hooks" (commands, rendering events, ...) we use.
fabric_version=0.116.17+1.21.1

# --- Our mod ---
mod_version=0.1.0
maven_group=dev.lyricmod
archives_base_name=lyricmod
